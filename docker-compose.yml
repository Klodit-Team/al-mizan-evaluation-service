services:
  evaluation-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evaluation-service
    ports:
      - "8008:8008"
    environment:
      - PORT=8008
      - DB_HOST=evaluation-mysql
      - DB_PORT=3306
      - DB_USERNAME=evaluation
      - DB_PASSWORD=evaluation_secret
      - DB_DATABASE=evaluation_db
      - RABBITMQ_URL=amqp://guest:guest@al-mizan-rabbitmq:5672
      - RABBITMQ_QUEUE=evaluation_events
      - MINIO_ENDPOINT=al-mizan-minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_PUBLIC_ENDPOINT=localhost
      - MINIO_PUBLIC_PORT=9002
      - MINIO_PUBLIC_USE_SSL=false
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_EVALUATION_REPORTS_BUCKET=evaluation-reports
      - NODE_ENV=development
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - al-mizan-network
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: evaluation-mysql
    ports:
      - "3308:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root_secret
      - MYSQL_DATABASE=evaluation_db
      - MYSQL_USER=evaluation
      - MYSQL_PASSWORD=evaluation_secret
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - al-mizan-network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  al-mizan-network:
    name: al-mizan-network
    external: true
